<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account | Waypoint+</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-tools">
      <button class="toolbtn" type="button" data-rtl aria-label="Toggle right to left">RTL</button>
      <button class="toolbtn" type="button" data-theme aria-label="Toggle theme">◐ Dark</button>
    </div>

    <div class="auth-card">
      <a class="brand auth-brand" href="index.html"><span class="brandmark">✦</span> WAYPOINT<span class="brand-plus">+</span></a>
      <h1>Create your account.</h1>
      <p>Join Waypoint+ for fuel rewards, EV charging perks, and market offers.</p>

      <form data-demo data-success="Account created! Welcome to Waypoint+ Rewards (demo).">
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" placeholder="Your name" required>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Create password</label>
          <div class="password-wrap">
            <input id="password" type="password" minlength="8" placeholder="At least 8 characters" required>
            <button type="button" class="eye-btn" data-toggle-password aria-label="Show password" aria-pressed="false"></button>
          </div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <div class="password-wrap">
            <input id="confirm-password" type="password" minlength="8" placeholder="Re-enter your password" required>
            <button type="button" class="eye-btn" data-toggle-password aria-label="Show password" aria-pressed="false"></button>
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" required>
          <span>I agree to the <a href="#" class="text-link">Terms &amp; Conditions</a> and <a href="#" class="text-link">Privacy Policy</a></span>
        </label>

        <button class="btn" type="submit">Create Account ↗</button>
        <p class="form-status" data-message aria-live="polite"></p>
      </form>

      <div class="auth-divider">Or sign up with</div>

      <div class="auth-socials">
        <button type="button" class="auth-social-btn" data-social-auth="Google" aria-label="Continue with Google">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/></svg>
        </button>
        <button type="button" class="auth-social-btn" data-social-auth="Facebook" aria-label="Continue with Facebook">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>
        </button>
        <button type="button" class="auth-social-btn" data-social-auth="X" aria-label="Continue with X">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </button>
        <button type="button" class="auth-social-btn" data-social-auth="LinkedIn" aria-label="Continue with LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.94 5a2 2 0 1 1-4-.002 2 2 0 0 1 4 .002zM7 8.48H3V21h4V8.48zm6.32 0H9.34V21h3.94v-6.57c0-3.66 4.77-4 4.77 0V21H22v-7.93c0-6.17-7.06-5.94-8.72-2.91l.04-1.68z"/></svg>
        </button>
      </div>

      <div class="auth-switch">Already have an account? <a href="login.html">Sign in</a></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
